<script>
 
const documentos = [
  { id: "cedula_frente", nombre: "Cédula (parte delantera)" },
  { id: "cedula_atras",  nombre: "Cédula (parte trasera)" },
  { id: "licencia",      nombre: "Licencia de Conducción" },
  { id: "soat",          nombre: "SOAT vigente" },
  { id: "revision",      nombre: "Revisión técnico-mecánica" },
  { id: "moto_frente",   nombre: "Mototaxi (parte delantera)" },
  { id: "moto_atras",    nombre: "Mototaxi (parte trasera, con la placa)" }
];
 
const iconoMas = '<svg viewBox="0 0 24 24"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>';
const iconoCamara = '<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
 
const fotos = {};        // fotos guardadas (reducidas) por documento
const pendientes = {};   // procesos de reducción en curso
let documentoCedula = ""; // número de documento leído de la foto de la cédula
let placaLeida = "";      // placa leída de la foto trasera del mototaxi
let tokenCedula = 0, tokenPlaca = 0;
let textosCedula = [];   // texto leído de la cédula (delantera y, si hizo falta, trasera)
let ocrFallo = false;     // true si no se pudo cargar/usar el lector de imágenes
const archivos = {};      // archivo original elegido por documento

function cargarTesseract(){
  return new Promise(function(ok, fallo){
    if (window.Tesseract) return ok(window.Tesseract);
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload = function(){ ok(window.Tesseract); };
    sc.onerror = fallo;
    document.head.appendChild(sc);
  });
}

function imagenParaOCR(archivo){
  return new Promise(function(ok){
    const lector = new FileReader();
    lector.onload = function(){
      const img = new Image();
      img.onload = function(){
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.92));
      };
      img.onerror = function(){ ok(null); };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

function extraerNumero(texto){
  let m = texto.match(/N[UÚ]MERO[^\d]{0,15}(\d[\d.,' ]{5,16}\d)/i);
  if (!m) m = texto.match(/\b(\d{1,3}(?:[.,]\d{3}){2,3})\b/);
  if (m) {
    const d = m[1].replace(/\D/g, "");
    if (d.length >= 6 && d.length <= 10) return d;
  }
  const todos = texto.match(/\d{6,10}/g) || [];
  todos.sort(function(x, y){ return y.length - x.length; });
  return todos[0] || "";
}

function leerTextoCedula(archivo){
  return Promise.all([cargarTesseract(), imagenParaOCR(archivo)]).then(function(r){
    if (!r[1]) return "";
    return r[0].recognize(r[1], "spa").then(function(res){ return res.data.text || ""; });
  }).catch(function(){ ocrFallo = true; return ""; });
}

// ---------- Verificación: el nombre de la cuenta debe ser el de la cédula ----------
const PALABRAS_IGNORADAS = ["DE","DEL","LA","LAS","LOS","Y","APELLIDOS","NOMBRES","NOMBRE","COLOMBIA","REPUBLICA","CEDULA","CIUDADANIA","NUMERO","FIRMA","IDENTIFICACION","PERSONAL"];
function normalizar(s){
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z\s]/g, " ").replace(/\s+/g, " ").trim();
}
function distancia(a, b){
  const d = [];
  for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (let j = 1; j <= b.length; j++) { d[0][j] = j; }
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  }
  return d[a.length][b.length];
}
// Devuelve { ok, msg }. Tolera pequeños errores de lectura de la foto (1-2 letras)
function verificarNombre(nombreCuenta, textoCedula){
  const palabrasCedula = normalizar(textoCedula).split(" ").filter(function(w){ return w.length >= 3; });
  if (palabrasCedula.join("").length < 20) {
    return { ok:false, msg: ocrFallo
      ? "No pudimos leer la cédula (revisa tu conexión a internet e inténtalo de nuevo)."
      : "No pudimos leer tu cédula. Sube una foto más clara y completa de la parte delantera." };
  }
  const nombres = normalizar(nombreCuenta).split(" ").filter(function(t){
    return t.length >= 2 && PALABRAS_IGNORADAS.indexOf(t) === -1;
  });
  if (nombres.length < 2) {
    return { ok:false, msg:"Tu nombre de registro debe ser el nombre completo, tal como aparece en la cédula." };
  }
  let coinciden = 0;
  nombres.forEach(function(t){
    const tol = t.length >= 8 ? 2 : (t.length >= 4 ? 1 : 0);
    if (palabrasCedula.some(function(w){ return Math.abs(w.length - t.length) <= tol && distancia(w, t) <= tol; })) coinciden++;
  });
  if (coinciden >= Math.max(2, Math.ceil(nombres.length * 0.75))) return { ok:true, msg:"" };
  return { ok:false, msg:"El nombre de tu cuenta (" + nombreCuenta + ") no coincide con el de la cédula. La información debe ser la misma." };
}
 

function aLetra(c){ return ({"0":"O","1":"I","5":"S","8":"B","2":"Z","6":"G"})[c] || c; }
function aDigito(c){ return ({"O":"0","Q":"0","D":"0","I":"1","L":"1","S":"5","B":"8","Z":"2","G":"6"})[c] || c; }

// Placas colombianas: 3 letras + 3 números (ABC-123), 3 letras + 2 números + 1 letra (ABC-12D, motos)
// o 3 números + 3 letras (241-NAO, mototaxis y placas de servicio público).
// Devuelve todas las placas posibles que aparecen en el texto, con cuántas letras hubo que corregir
function formatoPlaca(w, f){          // f: "LLLDDD" | "LLLDDL" | "DDDLLL"
  let costo = 0, r = "";
  for (let k = 0; k < 6; k++) {
    const quiere = f[k], c = w[k];
    let x;
    if (quiere === "L") {
      x = /[A-Z]/.test(c) ? c : aLetra(c);
      if (x === "Q") x = "O";         // la O cuadrada de la placa se parece mucho a una Q
      if (!/[A-Z]/.test(x)) return null;
    } else {
      x = /\d/.test(c) ? c : aDigito(c);
      if (!/\d/.test(x)) return null;
    }
    if (x !== c) costo++;
    r += x;
  }
  if (costo > 1) return null;
  return { placa: r.substr(0, 3) + "-" + r.substr(3), costo: costo };
}
function extraerPlacas(texto){
  // Palabras sueltas en orden de lectura; una placa es una palabra de 6-7 caracteres (ABC123)
  // o 2-3 palabras seguidas con forma 3+3, 3+2 o 3+2+1 (ABC 123 / ABC 12 D)
  const p = texto.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  const candidatos = [];
  for (let i = 0; i < p.length; i++) {
    if (p[i].length === 6 || p[i].length === 7) {
      for (let k = 0; k + 6 <= p[i].length; k++) candidatos.push(p[i].substr(k, 6));
    }
    if (p[i].length === 3 && p[i+1] && (p[i+1].length === 3 || p[i+1].length === 2)) {
      candidatos.push(p[i] + p[i+1]);
      if (p[i+1].length === 2 && p[i+2] && p[i+2].length === 1) candidatos.push(p[i] + p[i+1] + p[i+2]);
    }
  }
  const halladas = {};
  candidatos.forEach(function(w){
    if (w.length !== 6) return;
    ["LLLDDD", "LLLDDL", "DDDLLL"].forEach(function(f){
      const r = formatoPlaca(w, f);
      if (r && (halladas[r.placa] === undefined || r.costo < halladas[r.placa])) halladas[r.placa] = r.costo;
    });
  });
  return Object.keys(halladas).map(function(k){ return { placa:k, costo:halladas[k] }; });
}

// Prepara varias versiones de la foto (contraste, blanco y negro, recorte ampliado) para que el lector vea mejor la placa
function crearVariantes(url){
  return new Promise(function(ok){
    const img = new Image();
    img.onerror = function(){ ok([]); };
    img.onload = function(){
      function lienzo(sx, sy, sw, sh, escala){
        const c = document.createElement("canvas");
        c.width = Math.round(sw * escala); c.height = Math.round(sh * escala);
        c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        return c;
      }
      function filtrar(c, blancoNegro){
        const x = c.getContext("2d"), d = x.getImageData(0, 0, c.width, c.height), p = d.data;
        const n = p.length / 4, g = new Uint8Array(n), h = new Array(256).fill(0);
        for (let i = 0; i < n; i++) { const v = Math.round(0.299*p[4*i] + 0.587*p[4*i+1] + 0.114*p[4*i+2]); g[i] = v; h[v]++; }
        let acc = 0, lo = 0, hi = 255;
        for (let v = 0; v < 256; v++) { acc += h[v]; if (acc >= n * 0.02) { lo = v; break; } }
        acc = 0;
        for (let v = 255; v >= 0; v--) { acc += h[v]; if (acc >= n * 0.02) { hi = v; break; } }
        if (hi <= lo) { lo = 0; hi = 255; }
        const h2 = new Array(256).fill(0);
        for (let i = 0; i < n; i++) { g[i] = Math.max(0, Math.min(255, Math.round((g[i] - lo) * 255 / (hi - lo)))); h2[g[i]]++; }
        let umbral = -1;
        if (blancoNegro) {            // umbral de Otsu
          let suma = 0; for (let v = 0; v < 256; v++) suma += v * h2[v];
          let sB = 0, wB = 0, mejor = 0;
          for (let v = 0; v < 256; v++) {
            wB += h2[v]; if (!wB) continue;
            const wF = n - wB; if (!wF) break;
            sB += v * h2[v];
            const mB = sB / wB, mF = (suma - sB) / wF, var_ = wB * wF * (mB - mF) * (mB - mF);
            if (var_ > mejor) { mejor = var_; umbral = v; }
          }
        }
        for (let i = 0; i < n; i++) {
          const v = umbral >= 0 ? (g[i] > umbral ? 255 : 0) : g[i];
          p[4*i] = p[4*i+1] = p[4*i+2] = v; p[4*i+3] = 255;
        }
        x.putImageData(d, 0, 0);
        return c.toDataURL("image/png");
      }
      const w = img.width, h = img.height;
      const bn = filtrar(lienzo(0, 0, w, h, 1), true);
      ok([
        { url: filtrar(lienzo(0, 0, w, h, 1), false), psm: "11" },
        { url: bn, psm: "11" },
        { url: bn, psm: "6" },
        { url: filtrar(lienzo(w*0.15, h*0.15, w*0.7, h*0.7, Math.min(2, 1600 / (w*0.7))), false), psm: "11" }
      ]);
    };
    img.src = url;
  });
}

// ---------- Lectura letra por letra ----------
// Las placas con relieve (como 241-NAO) confunden al lector cuando se lee la foto completa.
// Aquí se busca la fila de 6 caracteres, se separa cada uno y se lee de forma individual,
// sabiendo en cada posición si toca número o letra.

// Etiqueta componentes conectados de una máscara (1 = tinta). Devuelve etiquetas y cajas.
function etiquetar(m, w, h, ocho){
  const lab = new Int32Array(w * h), cajas = [null];
  const pila = new Int32Array(w * h);
  let n = 0;
  for (let i = 0; i < w * h; i++) {
    if (!m[i] || lab[i]) continue;
    n++;
    let x0 = w, y0 = h, x1 = 0, y1 = 0, area = 0, sp = 0;
    pila[sp++] = i; lab[i] = n;
    while (sp) {
      const q = pila[--sp], x = q % w, y = (q - x) / w;
      area++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if ((!dx && !dy) || (!ocho && dx && dy)) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const j = ny * w + nx;
        if (m[j] && !lab[j]) { lab[j] = n; pila[sp++] = j; }
      }
    }
    cajas.push({ x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1, area: area });
  }
  return { lab: lab, cajas: cajas, n: n };
}

// Apertura morfológica (quita puntos y uniones finas, por ejemplo un tornillo pegado al número)
function aperturaMascara(m, w, h, r){
  function pasada(src, horizontal, todos){
    const dst = new Uint8Array(w * h), L = horizontal ? w : h, N = horizontal ? h : w;
    const pre = new Int32Array(L + 1);
    for (let t = 0; t < N; t++) {
      for (let i = 0; i < L; i++) pre[i + 1] = pre[i] + src[horizontal ? t * w + i : i * w + t];
      for (let i = 0; i < L; i++) {
        const a = Math.max(0, i - r), b = Math.min(L - 1, i + r), suma = pre[b + 1] - pre[a];
        const v = todos ? (suma === (2 * r + 1) ? 1 : 0) : (suma > 0 ? 1 : 0);
        dst[horizontal ? t * w + i : i * w + t] = v;
      }
    }
    return dst;
  }
  return pasada(pasada(pasada(pasada(m, true, true), false, true), true, false), false, false);
}

function umbralOtsu(g){
  const hist = new Array(256).fill(0);
  for (let i = 0; i < g.length; i++) hist[g[i]]++;
  const n = g.length; let suma = 0;
  for (let v = 0; v < 256; v++) suma += v * hist[v];
  let sB = 0, wB = 0, mejor = -1, umbral = 128;
  for (let v = 0; v < 256; v++) {
    wB += hist[v]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sB += v * hist[v];
    const mB = sB / wB, mF = (suma - sB) / wF, var_ = wB * wF * (mB - mF) * (mB - mF);
    if (var_ > mejor) { mejor = var_; umbral = v; }
  }
  return umbral;
}

// Devuelve una lista de imágenes (una por carácter, tinta negra sobre blanco) o [] si no hay una fila clara de 6
function separarCaracteres(img){
  // primero placa grande (ocupa buena parte de la foto); si no, placa pequeña (foto de todo el mototaxi)
  return separarCaracteresCon(img, 0.12, 0).concat(separarCaracteresCon(img, 0.035, 1));
}
function separarCaracteresCon(img, minAlto, radio){
  const k = Math.min(1, 1280 / Math.max(img.width, img.height));
  const W = Math.round(img.width * k), H = Math.round(img.height * k);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const cx = c.getContext("2d"); cx.drawImage(img, 0, 0, W, H);
  const px = cx.getImageData(0, 0, W, H).data;
  const g = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) g[i] = Math.round(0.299 * px[4*i] + 0.587 * px[4*i+1] + 0.114 * px[4*i+2]);
  const u = umbralOtsu(g);
  const m = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) m[i] = g[i] <= u ? 1 : 0;      // 1 = tinta (oscuro)
  const mo = aperturaMascara(m, W, H, radio || Math.max(2, Math.round(W / 400)));

  // 1) Caracteres "seguros": cajas de la misma altura y a la misma altura de la foto
  const et = etiquetar(mo, W, H, true);
  const cand = [];
  for (let i = 1; i <= et.n; i++) {
    const b = et.cajas[i];
    if (b.h >= minAlto * H && b.h <= 0.4 * H && b.w >= 0.4 * minAlto * H && b.w <= 0.25 * W) cand.push(b);
  }
  // Varios grupos posibles (por ejemplo las rayas del parachoques también se parecen a letras):
  // se prueban primero los que tienen cerca de 6 piezas y se queda con los que se separan en exactamente 6 caracteres
  const grupos = [];
  cand.forEach(function(a){
    const grupo = cand.filter(function(b){
      return Math.abs(b.h - a.h) < 0.15 * a.h && Math.abs((b.y + b.h / 2) - (a.y + a.h / 2)) < 0.15 * a.h;
    });
    if (grupo.length >= 3 && !grupos.some(function(g){ return g.length === grupo.length && g[0] === grupo[0]; })) grupos.push(grupo);
  });
  grupos.sort(function(x, y){ return Math.abs(x.length - 6) - Math.abs(y.length - 6) || y.length - x.length; });
  function mediana(v){ v = v.slice().sort(function(x, y){ return x - y; }); return v[Math.floor(v.length / 2)]; }
  const resultados = [], usados = {};
  grupos.slice(0, 6).forEach(function(mejor){
    const top = mediana(mejor.map(function(b){ return b.y; }));
    const bot = mediana(mejor.map(function(b){ return b.y + b.h; }));
    const bh = bot - top;
    if (bh < 20 || usados[top + "_" + bot]) return;
    // 2) Dentro de esa franja, se separa por columnas (así también se recuperan caracteres pegados al marco)
    const col = new Int32Array(W);
    for (let y = top; y < bot; y++) for (let x = 0; x < W; x++) col[x] += mo[y * W + x];
    const xMin = Math.min.apply(null, mejor.map(function(b){ return b.x; })) - 0.5 * bh;
    const xMax = Math.max.apply(null, mejor.map(function(b){ return b.x + b.w; })) + 0.5 * bh;
    const tramos = [];
    let ini = -1;
    for (let x = 0; x <= W; x++) {
      const hay = x < W && col[x] > 0.05 * bh;
      if (hay && ini < 0) ini = x;
      if (!hay && ini >= 0) {
        let mx = 0; for (let t = ini; t < x; t++) if (col[t] > mx) mx = col[t];
        const ancho = x - ini;
        if (ini >= xMin - bh && x <= xMax + 1.15 * bh) {
          // varios caracteres pegados: se corta en el punto con menos tinta cerca de donde debería estar cada corte
          const partes = ancho > 0.7 * bh ? Math.max(2, Math.round(ancho / (0.55 * bh))) : 1;
          let desde = ini;
          for (let q = 1; q <= partes; q++) {
            let hasta = x;
            if (q < partes) {
              const centro = Math.round(ini + ancho * q / partes), rad = Math.max(2, Math.round(ancho / partes * 0.25));
              let mn = 1e9; hasta = centro;
              for (let t = centro - rad; t <= centro + rad; t++) if (col[t] < mn) { mn = col[t]; hasta = t; }
            }
            let mxp = 0; for (let t = desde; t < hasta; t++) if (col[t] > mxp) mxp = col[t];
            const anchoP = hasta - desde;
            if (anchoP >= 0.3 * bh && anchoP <= 0.7 * bh && mxp >= 0.4 * bh) tramos.push([desde, hasta]);
            desde = hasta;
          }
        }
        ini = -1;
      }
    }
    // los que están dentro del margen normal; si falta uno (típico: el primero o el último quedó pegado al marco),
    // se completa con el tramo vecino más cercano
    let sel = tramos.filter(function(t){ return t[0] >= xMin && t[1] <= xMax + 0.15 * bh; });
    if (sel.length === 5) {
      const izq = tramos.filter(function(t){ return t[1] <= sel[0][0]; }).pop();
      const der = tramos.filter(function(t){ return t[0] >= sel[4][1]; })[0];
      const gi = izq ? sel[0][0] - izq[1] : 1e9, gd = der ? der[0] - sel[4][1] : 1e9;
      if (Math.min(gi, gd) <= 0.5 * bh) sel = gi <= gd ? [izq].concat(sel) : sel.concat([der]);
    }
    if (sel.length !== 6) return;
    usados[top + "_" + bot] = 1;
    resultados.push(recortarCaracteres(m, W, top, bh, sel));
  });
  return resultados;
}

// Cada carácter: se toma de la máscara original, se deja solo la pieza grande y se rellenan manchitas
function recortarCaracteres(m, W, top, bh, tramos){
  return tramos.map(function(t){
    const gw = t[1] - t[0], gh = bh;
    const gm = new Uint8Array(gw * gh);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) gm[y * gw + x] = m[(top + y) * W + t[0] + x];
    const e = etiquetar(gm, gw, gh, true);
    let gran = 0;
    for (let i = 1; i <= e.n; i++) if (!gran || e.cajas[i].area > e.cajas[gran].area) gran = i;
    const limpio = new Uint8Array(gw * gh);
    for (let i = 0; i < gw * gh; i++) limpio[i] = e.lab[i] === gran ? 1 : 0;
    const fondo = limpio.map(function(v){ return v ? 0 : 1; });
    const ef = etiquetar(fondo, gw, gh, false);
    for (let i = 1; i <= ef.n; i++) {
      const b = ef.cajas[i];
      const toca = b.x === 0 || b.y === 0 || b.x + b.w === gw || b.y + b.h === gh;
      if (!toca && b.area < 0.015 * gw * gh) for (let j = 0; j < gw * gh; j++) if (ef.lab[j] === i) limpio[j] = 1;
    }
    const cc = document.createElement("canvas"); cc.width = gw; cc.height = gh;
    const cg = cc.getContext("2d"), dd = cg.createImageData(gw, gh);
    for (let i = 0; i < gw * gh; i++) { const v = limpio[i] ? 0 : 255; dd.data[4*i] = dd.data[4*i+1] = dd.data[4*i+2] = v; dd.data[4*i+3] = 255; }
    cg.putImageData(dd, 0, 0);
    return cc;
  });
}

function escalarCaracter(cc, alto){
  const f = alto / cc.height, borde = 40;
  const c = document.createElement("canvas");
  c.width = Math.round(cc.width * f) + 2 * borde; c.height = alto + 2 * borde;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingQuality = "high";
  x.drawImage(cc, borde, borde, c.width - 2 * borde, alto);
  return c.toDataURL("image/png");
}

const FORMATOS_PLACA = ["DDDLLL", "LLLDDD", "LLLDDL"];
// Lee cada carácter dos veces (como número y como letra) y elige el formato de placa que mejor encaja
function leerPlacaPorLetras(w, img){
  const conjuntos = separarCaracteres(img).slice(0, 4);
  return conjuntos.reduce(function(p, chars){
    return p.then(function(prev){ return prev || leerConjunto(w, chars); });
  }, Promise.resolve(""));
}
function leerConjunto(w, chars){
  const lista = { D: "0123456789", L: "ABCDEFGHIJKLMNOPQRSTUVWXYZ" };
  const votos = chars.map(function(){ return { D: {}, L: {} }; });
  const tareas = [];
  chars.forEach(function(cc, i){
    [120, 160, 200].forEach(function(alto){
      const url = escalarCaracter(cc, alto);
      ["D", "L"].forEach(function(clase){ tareas.push({ i: i, clase: clase, url: url }); });
    });
  });
  let seguir = Promise.resolve();
  ["D", "L"].forEach(function(clase){
    seguir = seguir.then(function(){
      return w.setParameters({ tessedit_pageseg_mode: "8", tessedit_char_whitelist: lista[clase] });
    }).then(function(){
      return tareas.filter(function(t){ return t.clase === clase; }).reduce(function(p, t){
        return p.then(function(){
          return w.recognize(t.url).then(function(res){
            let ch = ((res.data.text || "").replace(/[^A-Z0-9]/gi, "").toUpperCase())[0];
            if (!ch) return;
            if (clase === "L" && ch === "Q") ch = "O";            // la O cuadrada se lee como Q
            const v = votos[t.i][clase];
            v[ch] = (v[ch] || 0) + Math.max(1, res.data.confidence || 0);
          }).catch(function(){});
        });
      }, Promise.resolve());
    });
  });
  return seguir.then(function(){
    let mejorPlaca = "", mejorPuntaje = 0;
    FORMATOS_PLACA.forEach(function(f){
      let r = "", total = 0, completo = true;
      for (let i = 0; i < 6; i++) {
        const v = votos[i][f[i]]; let ch = "", pt = 0;
        Object.keys(v).forEach(function(k){ if (v[k] > pt) { pt = v[k]; ch = k; } });
        if (!ch) { completo = false; break; }
        r += ch; total += pt;
      }
      if (completo && total > mejorPuntaje) { mejorPuntaje = total; mejorPlaca = r.substr(0, 3) + "-" + r.substr(3); }
    });
    return mejorPuntaje >= 6 * 120 * 0.3 ? mejorPlaca : "";   // al menos ~30% de confianza media (3 lecturas por carácter)
  });
}

function cargarImagenURL(url){
  return new Promise(function(ok){
    const i = new Image(); i.onload = function(){ ok(i); }; i.onerror = function(){ ok(null); }; i.src = url;
  });
}

// Lee la placa de la foto: varias pasadas completas y, si no queda clara, lectura letra por letra
function leerPlaca(archivo){
  return Promise.all([cargarTesseract(), imagenParaOCR(archivo)]).then(function(r){
    if (!r[1]) return "";
    return Promise.all([r[0].createWorker("eng"), crearVariantes(r[1]), cargarImagenURL(r[1])]).then(function(x){
      const w = x[0], variantes = x[1], imagen = x[2], votos = {};
      let confirmada = "", porLetras = "";
      // 1) Lectura letra por letra (la más fiable cuando se logra separar los 6 caracteres)
      return (imagen ? leerPlacaPorLetras(w, imagen).catch(function(){ return ""; }) : Promise.resolve("")).then(function(p0){
        porLetras = p0;
        if (porLetras) return;
        // 2) Si no, varias pasadas sobre la foto completa y se queda con la que más se repite
        return variantes.reduce(function(p, v){
          return p.then(function(){
            if (confirmada) return;      // dos lecturas iguales y sin correcciones: ya es segura
            return w.setParameters({ tessedit_pageseg_mode: v.psm, tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789" })
              .then(function(){ return w.recognize(v.url); })
              .then(function(res){
                extraerPlacas(res.data.text || "").forEach(function(c){
                  const e = votos[c.placa] || (votos[c.placa] = { n:0, costo:9 });
                  e.n++; e.costo = Math.min(e.costo, c.costo);
                  if (e.n >= 2 && e.costo === 0) confirmada = c.placa;
                });
              }).catch(function(){});
          });
        }, Promise.resolve());
      }).then(function(){
        return w.terminate().catch(function(){});
      }).then(function(){
        if (porLetras) return porLetras;
        if (confirmada) return confirmada;
        let mej = null;
        Object.keys(votos).forEach(function(k){
          const e = votos[k];
          if (!mej || e.n > votos[mej].n || (e.n === votos[mej].n && e.costo < votos[mej].costo)) mej = k;
        });
        return mej || "";
      });
    });
  }).catch(function(){ ocrFallo = true; return ""; });
}

function comprimir(archivo){
  return new Promise(function(ok){
    const lector = new FileReader();
    lector.onload = function(){
      const img = new Image();
      img.onload = function(){
        const k = Math.min(1, 700 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = function(){ ok(null); };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}
 

// Lee el número de la cédula: primero la parte delantera y, si no se logra, la trasera
function procesarCedula(){
  const token = ++tokenCedula;
  const estadoF = document.querySelector('input[name="cedula_frente"]').closest(".doc").querySelector(".estado");
  documentoCedula = "";
  textosCedula = [];
  ocrFallo = false;
  if (archivos.cedula_frente) estadoF.textContent = "Leyendo cédula…";
  const frente = archivos.cedula_frente ? leerTextoCedula(archivos.cedula_frente) : Promise.resolve("");
  pendientes.cedula_ocr = frente.then(function(tf){
    // si en la parte delantera no se lee el número, se intenta con la trasera
    if (extraerNumero(tf) || !archivos.cedula_atras) return [tf, ""];
    return leerTextoCedula(archivos.cedula_atras).then(function(ta){ return [tf, ta]; });
  }).then(function(t){
    if (token !== tokenCedula) return;
    textosCedula = t;
    documentoCedula = extraerNumero(t[0]) || extraerNumero(t[1]);
    if (archivos.cedula_frente) estadoF.textContent = "Foto cargada ✓";
  });
}

// Lee la placa de la foto trasera del mototaxi automáticamente
function procesarPlaca(estado){
  const token = ++tokenPlaca;
  placaLeida = "";
  estado.textContent = "Leyendo placa…";
  pendientes.placa_ocr = leerPlaca(archivos.moto_atras).then(function(p){
    if (token !== tokenPlaca) return;
    placaLeida = p;
    estado.textContent = p ? "Foto cargada ✓ Placa: " + p : "No se detectó la placa: sube otra foto";
  });
}
 
const contenedor = document.getElementById("documentos");
 
documentos.forEach(function(d){
  const label = document.createElement("label");
  label.className = "doc";
  label.innerHTML =
    '<span class="mas">' + iconoMas + '</span>' +
    '<span class="texto">' +
      '<span class="nombre">' + d.nombre + '</span>' +
      '<span class="estado">Subir Foto</span>' +
    '</span>' +
    '<span class="camara">' + iconoCamara + '</span>' +
    '<input type="file" name="' + d.id + '" accept="image/*" required>';
 
  const input = label.querySelector("input");
  const estado = label.querySelector(".estado");
  input.addEventListener("change", function(){
    if (!input.files.length) return;
    archivos[d.id] = input.files[0];
    label.classList.add("listo");
    estado.textContent = "Foto cargada ✓";
    pendientes[d.id] = comprimir(input.files[0]).then(function(url){ fotos[d.id] = url; });

    if (d.id === "cedula_frente" || d.id === "cedula_atras") procesarCedula();
    if (d.id === "moto_atras") procesarPlaca(estado);
  });
 
  contenedor.appendChild(label);
});
 
document.getElementById("formConductor").addEventListener("submit", function(e){
  e.preventDefault();
  const boton = document.querySelector('#formConductor button[type="submit"]');
  const error = document.getElementById("errorVer");
  error.style.display = "none";
  boton.disabled = true; boton.textContent = "VERIFICANDO…";
  Promise.all(Object.values(pendientes)).then(function(){
    const cuenta = TUK.cuenta() || {};
    const v = verificarNombre(cuenta.nombre || "", textosCedula.join(" "));
    function rechazar(msg, conEnlace){
      error.innerHTML = "";
      error.appendChild(document.createTextNode(msg + " "));
      if (conEnlace) {
        const enlace = document.createElement("a");
        enlace.href = "registro.html"; enlace.textContent = "Corregir mi registro";
        enlace.style.color = "#b00";
        error.appendChild(enlace);
      }
      error.style.display = "block";
      error.scrollIntoView({ behavior:"smooth", block:"center" });
      boton.disabled = false; boton.textContent = "SIGUIENTE";
    }
    if (!v.ok) return rechazar(v.msg, true);          // no se crea el perfil
    if (!placaLeida) return rechazar(ocrFallo
      ? "No pudimos leer la placa (revisa tu conexión a internet e inténtalo de nuevo)."
      : "No pudimos leer la placa en la foto trasera del mototaxi. Sube otra foto, de frente, con buena luz y la placa bien visible.", false);
    try {
      localStorage.setItem("tuk_docs", JSON.stringify(fotos));
      localStorage.setItem("tuk_datos", JSON.stringify({
        documento: documentoCedula,
        verificado: true
      }));
      // Placa: se guarda en los datos del vehículo, que es lo que muestra el perfil
      let veh = {};
      try { veh = JSON.parse(localStorage.getItem("tuk_vehiculo") || "{}"); } catch(e2){}
      veh.placa = placaLeida;
      localStorage.setItem("tuk_vehiculo", JSON.stringify(veh));
      localStorage.setItem("tuk_enlinea", "1");
      if (!localStorage.getItem("tuk_registro")) {
        localStorage.setItem("tuk_registro", new Date().toLocaleDateString("es-CO", { day:"numeric", month:"long", year:"numeric" }));
      }
    } catch(err) { console.warn("No se pudieron guardar los datos:", err); }
    window.location.replace("inicio-conductor.html");
  });
});
