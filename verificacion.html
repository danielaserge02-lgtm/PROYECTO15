<!DOCTYPE html>
<html lang="es">

<head>
<script src="tuk.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificar identidad</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Times New Roman", serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#52c6f4;
}

.telefono{
width:330px;
height:700px;
background:#e2f1f8;
border-radius:30px;
position:relative;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

/* Ondas */

.telefono::before{
content:"";
position:absolute;
width:450px;
height:450px;
border:4px solid white;
border-radius:50%;
left:-270px;
top:-50px;
}

.telefono::after{
content:"";
position:absolute;
width:480px;
height:480px;
border:4px solid white;
border-radius:50%;
right:-300px;
bottom:-180px;
}

.onda1{
position:absolute;
width:380px;
height:380px;
border:4px solid #2cb5e8;
border-radius:50%;
left:-260px;
top:170px;
}

.onda2{
position:absolute;
width:360px;
height:360px;
border:4px solid #2cb5e8;
border-radius:50%;
right:-240px;
top:-40px;
}

.contenido{
position:relative;
z-index:2;
padding:25px;
}

.logo{
text-align:center;
font-size:65px;
font-weight:bold;
margin-top:20px;
margin-bottom:40px;
}

h2{
text-align:center;
margin-bottom:35px;
font-size:28px;
}

label{
display:block;
margin-bottom:5px;
font-size:16px;
}

input{
width:100%;
padding:10px;
margin-bottom:18px;
border:none;
border-radius:15px;
background:#d9d9d9;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
background:#d9d9d9;
font-size:20px;
cursor:pointer;
border-radius:5px;
transition:.3s;
}

button:hover{
background:#bdbdbd;
}

.enlaces{
margin-top:20px;
text-align:center;
}

.enlaces a{
display:block;
margin-top:12px;
text-decoration:none;
color:black;
font-size:16px;
}

.enlaces a:hover{
text-decoration:underline;
}


.logo{font-size:48px;margin-top:10px;margin-bottom:18px;}
h2{font-size:24px;margin-bottom:14px;}
.texto{text-align:center;font-size:15px;margin-bottom:18px;line-height:1.35;}
.espera{text-align:center;font-size:15px;margin-bottom:14px;min-height:20px;color:#0a4aa8;font-weight:bold;}
#codigo{text-align:center;font-size:28px;letter-spacing:10px;padding:12px;}
#codigo:disabled{opacity:.5;}
button:disabled{opacity:.5;cursor:default;}
.err{color:#b00;text-align:center;font-size:14px;min-height:18px;margin-top:8px;}
.notif{position:absolute;left:10px;right:10px;top:0;transform:translateY(-130px);z-index:20;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.97);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .45s ease;cursor:pointer;}
.notif.mostrar{transform:translateY(14px);}
.notif .ic{flex:none;width:38px;height:38px;border-radius:10px;background:#1a73e8;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:13px;}
.notif .tx b{display:block;font-size:14px;}
.notif .tx span{display:block;font-size:13px;margin-top:2px;}
.notif .tx em{font-style:normal;font-weight:bold;font-size:16px;letter-spacing:2px;}
</style>

</head>

<body>

<div class="telefono">

<div class="onda1"></div>
<div class="onda2"></div>

<!-- Notificación con el código -->
<div class="notif" id="notif" role="alert">
<div class="ic">TÜK</div>
<div class="tx"><b>Código de verificación</b><span id="notifTxt"></span></div>
</div>

<div class="contenido">

<div class="logo">TUK</div>

<h2>VERIFICA TU IDENTIDAD</h2>

<p class="texto" id="info"></p>
<div class="espera" id="espera"></div>

<form id="f" autocomplete="off">
<input type="text" id="codigo" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="······" disabled>
<button type="submit" id="verificar" disabled>VERIFICAR</button>
</form>
<div class="err" id="err"></div>

<div class="enlaces">
<a href="#" id="reenviar" style="display:none;">Reenviar código</a>
<a href="#" id="salir">Cancelar y salir</a>
</div>

</div>

</div>

<script>
(function(){
var t=TUK.t, $=function(i){return document.getElementById(i)};

// Los conductores no pasan por esta pantalla
if(localStorage.getItem("tuk_rol")!=="usuario"){location.replace(localStorage.getItem("tuk_rol")==="conductor"?(localStorage.getItem("tuk_docs")?"inicio-conductor.html":"conductor.html"):"index.html");return}

var cuenta=TUK.cuenta()||{}, tel=String(cuenta.telefono||"").replace(/\D/g,"");
$("info").textContent=t("Te enviaremos un código de verificación a tu celular")+(tel.length>=4?" ··· "+tel.slice(-4):"")+".";

var ESPERA=10, VIDA=5*60*1000, MAX_INTENTOS=3;
var codigo=null, vence=0, intentos=0, reloj=null, ocultar=null;

// Código de 6 dígitos distinto en cada ingreso (nunca igual al anterior)
function nuevoCodigo(){
  var prev=localStorage.getItem("tuk_cod_prev")||"", n;
  do{
    var v;
    if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);v=a[0]}else{v=Math.floor(Math.random()*4294967296)}
    n=String(v%1000000).padStart(6,"0");
  }while(n===prev||/^(\d)\1{5}$/.test(n));
  localStorage.setItem("tuk_cod_prev",n);
  return n;
}

function mostrarNotificacion(c){
  $("notifTxt").innerHTML=t("Tu código TÜK es")+" <em>"+c.slice(0,3)+" "+c.slice(3)+"</em>. "+t("No lo compartas con nadie.");
  $("notif").classList.add("mostrar");
  TUK.beep();
  try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}
  clearTimeout(ocultar);
  ocultar=setTimeout(function(){$("notif").classList.remove("mostrar")},20000);
}
$("notif").addEventListener("click",function(){this.classList.remove("mostrar")});

function iniciar(){
  clearInterval(reloj);
  codigo=null; intentos=0;
  $("codigo").value=""; $("codigo").disabled=true; $("verificar").disabled=true;
  $("reenviar").style.display="none"; $("err").textContent="";
  $("notif").classList.remove("mostrar");
  var s=ESPERA;
  $("espera").textContent=t("El código llegará en")+" "+s+" s";
  reloj=setInterval(function(){
    s--;
    if(s>0){$("espera").textContent=t("El código llegará en")+" "+s+" s";return}
    clearInterval(reloj);
    codigo=nuevoCodigo(); vence=Date.now()+VIDA;
    $("espera").textContent=t("Te enviamos un código. Escríbelo aquí.");
    $("codigo").disabled=false; $("verificar").disabled=false; $("codigo").focus();
    $("reenviar").style.display="block";
    mostrarNotificacion(codigo);
  },1000);
}

$("codigo").addEventListener("input",function(){this.value=this.value.replace(/\D/g,"").slice(0,6)});

$("f").addEventListener("submit",function(e){
  e.preventDefault();
  var err=$("err"), v=$("codigo").value;
  if(!codigo){err.textContent=t("Aún no ha llegado el código.");return}
  if(Date.now()>vence){codigo=null;err.textContent=t("El código venció. Pide uno nuevo.");return}
  if(v.length!==6){err.textContent=t("Escribe el código de 6 dígitos.");return}
  if(v!==codigo){
    intentos++;
    if(intentos>=MAX_INTENTOS){codigo=null;$("codigo").disabled=true;$("verificar").disabled=true;err.textContent=t("Demasiados intentos. Pide un código nuevo.")}
    else{err.textContent=t("Código incorrecto.")}
    $("codigo").value="";
    return;
  }
  // Identidad verificada: este ingreso queda habilitado y el código se descarta
  codigo=null;
  localStorage.setItem("tuk_verif","1");
  var c=TUK.cuenta()||{}; c.verificada=new Date().toISOString().slice(0,10); TUK.guardar(c);
  location.replace("usuario.html");
});

$("reenviar").addEventListener("click",function(e){e.preventDefault();iniciar()});
$("salir").addEventListener("click",function(e){
  e.preventDefault();
  localStorage.removeItem("tuk_sesion");localStorage.removeItem("tuk_verif");
  location.replace("index.html");
});

iniciar();
})();
</script>
</body>

</html>
